<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ORVO24 — GTA-style 3D ad (18s)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;background:#0a0a0a;font-family:system-ui,sans-serif}
#hud{
  position:fixed;inset:0;pointer-events:none;z-index:10;
  display:flex;flex-direction:column;justify-content:flex-end;padding:24px;
}
.sub{
  align-self:center;max-width:90%;text-align:center;
  background:rgba(0,0,0,.72);color:#fff;padding:12px 20px;border-radius:8px;
  font-size:clamp(14px,3.5vw,22px);font-weight:700;line-height:1.35;
  border-left:4px solid #FF6B35;opacity:0;transform:translateY(12px);
  transition:opacity .35s,transform .35s;
}
.sub.show{opacity:1;transform:none}
.brand{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:11;
  font-weight:800;font-size:14px;color:rgba(255,255,255,.5);letter-spacing:.12em;
}
.endcard{
  position:fixed;inset:0;z-index:20;background:rgba(11,18,32,.94);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .8s;
}
.endcard.show{opacity:1}
.endcard h1{font-size:clamp(28px,8vw,48px);color:#fff;margin-bottom:8px}
.endcard h1 span{color:#FF6B35}
.endcard p{color:rgba(255,255,255,.75);font-size:clamp(14px,3vw,18px);max-width:420px;text-align:center;line-height:1.5}
.endcard .cta{
  margin-top:24px;background:#FF6B35;color:#fff;padding:14px 32px;border-radius:10px;
  font-weight:800;font-size:16px;
}
.ui{
  position:fixed;top:12px;right:12px;z-index:30;display:flex;gap:8px;
}
.ui button{
  pointer-events:auto;font:inherit;font-size:12px;padding:8px 14px;border:none;
  border-radius:8px;background:#FF6B35;color:#fff;cursor:pointer;font-weight:600;
}
#canvas{display:block;width:100vw;height:100vh}
.loading{
  position:fixed;inset:0;z-index:100;background:#0B1220;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
</style>
</head>
<body>
<div class="loading" id="loading">טוען סצנה 3D…</div>
<div class="brand">ORVO24 · DEMO · NOT GTA</div>
<div class="ui">
  <button type="button" id="btn-play">▶ Play</button>
  <button type="button" id="btn-restart">↺</button>
</div>
<canvas id="canvas"></canvas>
<div id="hud"><div class="sub" id="sub"></div></div>
<div class="endcard" id="endcard">
  <h1><span>O</span>RVO · orvo24.com</h1>
  <p>מרקטפלייס לסוכני AI.<br/>אתה מפרסם — בונים מאומתים בונים.<br/>בלי לדעת לבנות סוכן לבד.</p>
  <div class="cta">orvo24.com</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';

const DURATION = 18;
const sub = document.getElementById('sub');
const endcard = document.getElementById('endcard');
const loading = document.getElementById('loading');

const LINES = [
  { t: 5.2, text: 'רגע, לא מוקדם?' },
  { t: 7.4, text: 'הסוכן שלי סיים לי את המשימות.' },
  { t: 10.0, text: 'אבל את לא יודעת לבנות סוכן…' },
  { t: 12.2, text: 'orvo24.com' },
  { t: 14.0, text: '' },
];

let clock = new THREE.Clock();
let elapsed = 0;
let playing = false;
let fired = new Set();

// ── Renderer ──
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0xC5D4E8, 18, 55);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);

// ── Lights (GTA-ish warm sun + fill) ──
scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.2);
sun.position.set(8, 18, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 40;
sun.shadow.camera.left = -15;
sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15;
sun.shadow.camera.bottom = -15;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8899ff, 0.25);
fill.position.set(-6, 8, -4);
scene.add(fill);

// ── Materials ──
const matFloor = new THREE.MeshStandardMaterial({ color: 0x9CA3AF, roughness: 0.85 });
const matWall = new THREE.MeshStandardMaterial({ color: 0xE5E7EB, roughness: 0.9 });
const matDesk = new THREE.MeshStandardMaterial({ color: 0xF3F4F6, roughness: 0.7 });
const matScreen = new THREE.MeshStandardMaterial({ color: 0xFF6B35, emissive: 0xFF6B35, emissiveIntensity: 0.3 });
const matSkin = new THREE.MeshStandardMaterial({ color: 0xFCD9BD, roughness: 0.6 });
const matShirtF = new THREE.MeshStandardMaterial({ color: 0xFF6B35, roughness: 0.75 });
const matShirtM = new THREE.MeshStandardMaterial({ color: 0x3B82F6, roughness: 0.75 });
const matPants = new THREE.MeshStandardMaterial({ color: 0x1E293B, roughness: 0.8 });
const matHairF = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
const matHairM = new THREE.MeshStandardMaterial({ color: 0x2d2d2d, roughness: 0.9 });
const matPlant = new THREE.MeshStandardMaterial({ color: 0x22C55E, roughness: 0.7 });

function box(w, h, d, mat, x, y, z, parent, cast = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = true;
  (parent || scene).add(m);
  return m;
}

// ── Office room ──
box(24, 0.2, 16, matFloor, 0, 0, 0);
box(24, 6, 0.3, matWall, 0, 3, -8);
box(0.3, 6, 16, matWall, -12, 3, 0);
box(0.3, 6, 16, matWall, 12, 3, 0);
// window
box(10, 3.5, 0.15, new THREE.MeshStandardMaterial({ color: 0x7DD3FC, emissive: 0x38BDF8, emissiveIntensity: 0.15 }), 0, 4.2, -7.85);

// desks
[[-4, 0], [4, 0]].forEach(([dx]) => {
  box(3.5, 0.75, 1.6, matDesk, dx, 0.55, -2);
  box(1.4, 0.05, 0.9, matScreen, dx, 1.05, -2.1);
});

// plant
const plantG = new THREE.Group();
plantG.position.set(9, 0, -4);
box(0.5, 0.6, 0.5, new THREE.MeshStandardMaterial({ color: 0x78716C }), 0, 0.5, 0, plantG);
const potTop = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 10), matPlant);
potTop.position.y = 1.1;
potTop.scale.y = 0.7;
potTop.castShadow = true;
plantG.add(potTop);
scene.add(plantG);

// door frame
box(2.2, 4, 0.2, matWall, -10, 2, 2);
const door = box(2, 3.5, 0.12, new THREE.MeshStandardMaterial({ color: 0xD1D5DB }), -10, 1.95, 2.15);
door.userData.isDoor = true;

// ── Low-poly humanoid (GTA-ish capsule body) ──
function makeCharacter(shirtMat, hairMat, x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);

  const torso = box(0.55, 0.75, 0.35, shirtMat, 0, 1.15, 0, g);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10), matSkin);
  head.position.set(0, 1.75, 0);
  head.castShadow = true;
  g.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), hairMat);
  hair.position.set(0, 1.88, -0.02);
  hair.scale.set(1, 0.75, 1);
  g.add(hair);

  const legL = box(0.18, 0.65, 0.22, matPants, -0.14, 0.45, 0, g);
  const legR = box(0.18, 0.65, 0.22, matPants, 0.14, 0.45, 0, g);
  const armL = box(0.14, 0.55, 0.14, shirtMat, -0.38, 1.2, 0, g);
  const armR = box(0.14, 0.55, 0.14, shirtMat, 0.38, 1.2, 0, g);

  g.userData.parts = { legL, legR, armL, armR, head, torso };
  scene.add(g);
  return g;
}

const noa = makeCharacter(matShirtF, matHairF, 2, -1);
const guy = makeCharacter(matShirtM, matHairM, 5, -1.5);
const bg1 = makeCharacter(new THREE.MeshStandardMaterial({ color: 0x64748B }), matHairM, -2, -3);
const bg2 = makeCharacter(new THREE.MeshStandardMaterial({ color: 0x475569 }), matHairF, 7, -3.5);
bg1.scale.set(0.9, 0.9, 0.9);
bg2.scale.set(0.85, 0.85, 0.85);

// walk state
const walk = {
  active: false,
  startX: 2,
  endX: -9,
  startZ: -1,
  endZ: 4,
  t0: 3.2,
  dur: 2.4,
};

function setSubtitle(text) {
  if (!text) {
    sub.classList.remove('show');
    sub.textContent = '';
    return;
  }
  sub.textContent = text;
  sub.classList.add('show');
}

function updateWalk(t) {
  if (t < walk.t0) return;
  walk.active = true;
  const p = Math.min(1, (t - walk.t0) / walk.dur);
  const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
  noa.position.x = THREE.MathUtils.lerp(walk.startX, walk.endX, ease);
  noa.position.z = THREE.MathUtils.lerp(walk.startZ, walk.endZ, ease);
  noa.rotation.y = THREE.MathUtils.lerp(0, Math.PI * 0.55, ease);

  const swing = Math.sin(t * 12) * 0.35;
  noa.userData.parts.legL.rotation.x = swing;
  noa.userData.parts.legR.rotation.x = -swing;
  noa.position.y = Math.abs(Math.sin(t * 12)) * 0.04;

  door.rotation.y = -ease * 1.2;
  door.position.x = -10 + ease * 0.3;

  if (p > 0.3) guy.rotation.y = THREE.MathUtils.lerp(0, -0.9, (p - 0.3) / 0.7);
}

function updateCamera(t) {
  const target = new THREE.Vector3();
  const pos = new THREE.Vector3();

  if (t < 3) {
    // establishing wide
    pos.set(14, 8, 12);
    target.set(0, 1.2, -1);
  } else if (t < 5.5) {
    // follow Noa
    pos.set(noa.position.x + 4, 3.5, noa.position.z + 5);
    target.copy(noa.position).y += 1.4;
  } else if (t < 13.5) {
    // over-shoulder guy
    pos.set(guy.position.x + 2.5, 2.8, guy.position.z + 3);
    target.set(noa.position.x, 1.5, noa.position.z);
  } else {
    // pull back
    pos.set(0, 6, 14);
    target.set(0, 1, 0);
  }

  camera.position.lerp(pos, 0.08);
  const look = target.clone();
  camera.lookAt(look);
}

function updateDialogue(t) {
  for (const line of LINES) {
    if (t >= line.t && !fired.has(line.t)) {
      fired.add(line.t);
      if (line.t >= 14) {
        setSubtitle('');
        endcard.classList.add('show');
      } else {
        setSubtitle(line.text);
      }
    }
  }
  // hide subtitle before next (simple)
  if (t > 6.8 && t < 7.2 && fired.has(5.2)) setSubtitle(LINES[1].text);
  if (t > 9.4 && t < 9.8 && fired.has(7.4)) setSubtitle(LINES[2].text);
  if (t > 11.6 && t < 12 && fired.has(10)) setSubtitle(LINES[3].text);
}

function resetScene() {
  elapsed = 0;
  fired.clear();
  playing = false;
  walk.active = false;
  noa.position.set(2, 0, -1);
  noa.rotation.y = 0;
  guy.rotation.y = 0;
  door.rotation.y = 0;
  door.position.x = -10;
  endcard.classList.remove('show');
  setSubtitle('');
  clock = new THREE.Clock();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (playing) {
    elapsed += dt;
    if (elapsed >= DURATION) {
      playing = false;
    }
  }
  updateWalk(elapsed);
  updateCamera(elapsed);
  updateDialogue(elapsed);

  // idle typing bob on bg
  bg1.position.y = Math.sin(elapsed * 2) * 0.02;
  bg2.position.y = Math.sin(elapsed * 2.3 + 1) * 0.02;

  renderer.render(scene, camera);
}

function play() {
  resetScene();
  playing = true;
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('btn-play').addEventListener('click', play);
document.getElementById('btn-restart').addEventListener('click', play);

loading.style.display = 'none';
play();
animate();
</script>
</body>
</html>
