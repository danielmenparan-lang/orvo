<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>ORVO24 End Card</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;font-family:Inter,system-ui,-apple-system,sans-serif;background:#FAFAF8}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .55s ease}
.slide.on{opacity:1}
.logo{font-size:96px;font-weight:700;letter-spacing:-.03em;color:#111;margin-bottom:28px}
.logo span{color:#FF6B35}
.tag{font-size:36px;font-weight:400;color:#555;letter-spacing:.01em;margin-bottom:48px}
.url{font-size:52px;font-weight:600;color:#FF6B35;letter-spacing:.06em}
</style>
</head>
<body>
<div class="slide on" id="s0">
  <div class="logo">ORVO<span>24</span></div>
</div>
<div class="slide" id="s1">
  <div class="logo" style="font-size:72px;margin-bottom:32px">ORVO<span>24</span></div>
  <div class="tag">AI agents. Built for you.</div>
</div>
<div class="slide" id="s2">
  <div class="url">ORVO24.COM</div>
</div>
<script>
const q=new URLSearchParams(location.search);
const slides=[...document.querySelectorAll('.slide')];
if(q.has('slide')){
  const n=Math.min(slides.length-1,Math.max(0,parseInt(q.get('slide'),10)||0));
  slides.forEach((s,j)=>s.classList.toggle('on',j===n));
}else{
  let i=0;
  setInterval(()=>{
    slides[i].classList.remove('on');
    i=(i+1)%slides.length;
    slides[i].classList.add('on');
  },900);
}
</script>
</body>
</html>
