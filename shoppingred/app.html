<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ShoppingRed App</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#12141A;--panel:#1A1D26;--red:#E23B2F;--muted:#8B93A1;--line:rgba(255,255,255,.08);--ok:#34D399;--warn:#FBBF24}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--ink);color:#fff;min-height:100vh}
a{color:var(--red);text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.logo{font-family:Fraunces,serif;font-weight:700;font-size:20px}.logo span{color:var(--red)}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 80px}
h1{font-family:Fraunces,serif;font-size:28px;margin-bottom:6px}
.lead{color:var(--muted);margin-bottom:22px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{font-size:15px;margin-bottom:12px}
.drop{border:1px dashed rgba(255,255,255,.2);border-radius:12px;padding:28px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer}
.drop:hover{border-color:var(--red);color:#fff}
input[type=file]{display:none}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat{flex:1;min-width:110px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:Fraunces,serif;font-size:24px}
.stat span{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.pill.new{background:rgba(226,59,47,.2);color:#FCA5A5}
.pill.rec{background:rgba(251,191,36,.15);color:#FCD34D}
.pill.fix{background:rgba(52,211,153,.15);color:#6EE7B7}
.btn{margin-top:12px;padding:10px 14px;border-radius:999px;border:none;font-weight:600;cursor:pointer;font-size:13px}
.btn-red{background:var(--red);color:#fff;width:100%}
.btn-ghost{background:transparent;color:#fff;border:1px solid var(--line);margin-right:8px}
.fix{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.empty{color:var(--muted);text-align:center;padding:28px;font-size:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);padding:11px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">Shopping<span>Red</span></a>
  <a href="index.html" style="color:var(--muted);font-size:13px">Pricing</a>
</header>
<main class="wrap">
  <h1>Issue radar</h1>
  <p class="lead">Upload a Merchant Center issues / diagnostics CSV. We keep last week in this browser and compute the diff.</p>
  <div class="stats" id="stats"></div>
  <div class="grid">
    <div class="card">
      <h2>Upload export</h2>
      <label class="drop" id="drop">Drop CSV here or click to browse<input type="file" id="file" accept=".csv,text/csv"/></label>
      <button class="btn btn-ghost" id="btn-sample" type="button">Load sample week</button>
      <button class="btn btn-ghost" id="btn-clear" type="button">Clear history</button>
      <p class="fix" style="margin-top:14px">Expected columns (flexible): Item ID / Offer ID, Issue / Title, Severity. Extra columns ignored.</p>
    </div>
    <div class="card">
      <h2>Prioritized fixes</h2>
      <div id="table"><p class="empty">No upload yet.</p></div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script src="playbook.js"></script>
<script src="app.js"></script>
</body>
</html>
