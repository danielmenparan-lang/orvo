<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:800px;font-family:Inter,system-ui,sans-serif;background:#FAFAF8;color:#111;overflow:hidden}
.bar{height:4px;background:#FF6B35;width:35%}
.wrap{padding:48px 56px}
.tag{font-size:13px;font-weight:600;color:#FF6B35;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
h1{font-size:42px;font-weight:600;line-height:1.15;margin-bottom:16px}
p{font-size:20px;color:#555;line-height:1.45;max-width:520px}
.orvo{color:#FF6B35}
.mock{margin-top:28px;background:#fff;border:1px solid #e8e8e4;border-radius:12px;padding:20px 24px;max-width:420px}
.mock b{font-size:17px;display:block;margin-bottom:6px}
.mock span{font-size:15px;color:#666}
</style>
</head>
<body>
<div class="bar"></div>
<div class="wrap">
  <div class="tag">Q4 workflow</div>
  <h1>Automate client follow-ups</h1>
  <p>Build an AI agent on <span class="orvo">orvo24.com</span></p>
  <div class="mock"><b>Status</b><span>3 builders quoted · 1 selected</span></div>
</div>
</body>
</html>
