<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ORVO24 — דמויות v2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#0A0A0A;color:#fff;padding:32px 20px}
h1{font-size:26px;margin-bottom:6px}
.sub{color:rgba(255,255,255,.5);margin-bottom:28px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;max-width:1200px;margin:0 auto}
.card{background:#141414;border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.card-info{padding:12px 14px}
.card-info h3{font-size:14px;margin-bottom:3px}
.card-info p{font-size:12px;color:rgba(255,255,255,.45)}
a.back{display:block;text-align:center;margin-top:28px;color:#FF6B35;font-size:14px}
</style>
</head>
<body>
<h1>ORVO24 — 8 דמויות (v2)</h1>
<p class="sub">ideogram · photojournalism · לחץ לפתיחה בגודל מלא</p>
<div class="grid" id="grid"></div>
<a class="back" href="/">← חזרה לאתר</a>
<script>
const CDN = 'https://cdn.jsdelivr.net/gh/danielmenparan-lang/orvo@main/assets/characters/v2';
const chars = [
  {id:"01_hero_woman", name:"Maya", role:"הגיבורה"},
  {id:"02_guy_asks", name:"Tom", role:"שואל למה הולכת"},
  {id:"03_skeptic", name:"Alex", role:"הספקן"},
  {id:"04_woman_laptop", name:"Sarah", role:"בלפטופ"},
  {id:"05_man_laptop", name:"David", role:"בלפטופ"},
  {id:"06_woman_notes", name:"Lina", role:"רושמת"},
  {id:"07_man_senior", name:"Omer", role:"מנהל"},
  {id:"08_woman_junior", name:"Noa", role:"ג'וניור"},
];
document.getElementById('grid').innerHTML = chars.map(c => {
  const s = `${CDN}/${c.id}.jpg`;
  return `<div class="card"><a href="${s}" target="_blank"><img src="${s}" alt="${c.name}"/></a>
    <div class="card-info"><h3>${c.name}</h3><p>${c.role}</p></div></div>`;
}).join('');
</script>
</body>
</html>
