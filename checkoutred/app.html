<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CheckoutRed — בדיקה</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@700&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#0E1116;--panel:#171B24;--red:#F0433A;--ok:#34D399;--muted:#8B93A1;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Rubik,sans-serif;background:var(--ink);color:#fff;min-height:100vh}
a{color:var(--red);text-decoration:none}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.logo{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:20px}.logo b{color:var(--red)}
.wrap{max-width:640px;margin:0 auto;padding:32px 18px 80px}
h1{font-family:'Frank Ruhl Libre',serif;font-size:30px;margin-bottom:8px}
.lead{color:var(--muted);margin-bottom:24px;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#0E1116;color:#fff;font:inherit}
.btn{margin-top:16px;width:100%;padding:14px;border:none;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;background:var(--red);color:#fff}
.btn:disabled{opacity:.5}
.status{margin-top:18px;padding:18px;border-radius:14px;text-align:center;font-weight:600;display:none}
.status.show{display:block}
.status.ok{background:rgba(52,211,153,.12);color:var(--ok);border:1px solid rgba(52,211,153,.3)}
.status.bad{background:rgba(240,67,58,.12);color:#FCA5A5;border:1px solid rgba(240,67,58,.35)}
.cron{font-size:12px;color:var(--muted);word-break:break-all;background:#0E1116;border-radius:10px;padding:12px;margin-top:12px;border:1px solid var(--line);direction:ltr;text-align:left}
.hint{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">Checkout<b>Red</b></a>
  <a href="index.html" style="color:var(--muted);font-size:13px">מחירים</a>
</header>
<main class="wrap">
  <h1>בדיקת קופה</h1>
  <p class="lead">הדבק כתובת חנות Shopify. לחץ בדיקה. אם אדום — עצור מודעות.</p>
  <div class="card">
    <label>כתובת החנות</label>
    <input id="url" placeholder="https://your-store.myshopify.com" dir="ltr"/>
    <label>טוקן בוט טלגרם (אופציונלי להתראות)</label>
    <input id="tg-token" placeholder="123456:ABC..." dir="ltr"/>
    <label>Chat ID בטלגרם</label>
    <input id="tg-chat" placeholder="123456789" dir="ltr"/>
    <button class="btn" id="go">בדוק עכשיו</button>
    <div class="status" id="status"></div>
    <p class="hint">להתראות אוטומטיות: העתק את הקישור למטה ל־cron-job.org כל 5 דקות (אחרי Deploy ל־Netlify).</p>
    <div class="cron" id="cron">הקישור יופיע אחרי שתמלאו חנות + טלגרם</div>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
