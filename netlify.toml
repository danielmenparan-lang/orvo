[build]
  publish = "."

[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Content-Type = "video/mp4"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/orvo24/**/*.mp4"
  [headers.values]
    Content-Type = "video/mp4"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/orvo24/**/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
