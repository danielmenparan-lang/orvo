<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ORVO24 — Product Story</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#0A0A0A;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
h1{font-size:24px;margin-bottom:6px}
.sub{color:rgba(255,255,255,.55);margin-bottom:20px;font-size:14px;max-width:540px;text-align:center;line-height:1.5}
video{width:min(1000px,100%);border-radius:14px;background:#111;box-shadow:0 24px 80px rgba(255,107,53,.12);border:1px solid rgba(255,107,53,.15)}
.links{margin-top:18px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
a{color:#FF6B35;font-size:14px;text-decoration:none}
a:hover{text-decoration:underline}
#err{color:#ff6b6b;font-size:13px;margin-top:12px;display:none}
</style>
</head>
<body>
<h1>ORVO24 — Product Story</h1>
<p class="sub">v8 · 20 sec · full director brief · Hebrew voice · documentary tone</p>
<video id="v" controls autoplay playsinline preload="auto"
  poster="https://cdn.jsdelivr.net/gh/danielmenparan-lang/orvo@main/assets/orvo24/v8/poster.jpg">
  <source id="src" src="https://cdn.jsdelivr.net/gh/danielmenparan-lang/orvo@main/assets/orvo24/v8/orvo24-v8-web.mp4" type="video/mp4"/>
</video>
<p id="err"></p>
<div class="links">
  <a href="https://cdn.jsdelivr.net/gh/danielmenparan-lang/orvo@main/assets/orvo24/v8/orvo24-v8-web.mp4" download="orvo24-v8.mp4">↓ Download (voice + subs)</a>
  <a href="https://cdn.jsdelivr.net/gh/danielmenparan-lang/orvo@main/assets/orvo24/v8/orvo24-v8.mp4" download="orvo24-v8-full.mp4">↓ Full quality</a>
  <a href="/">← Back</a>
</div>
<script>
const CDN="https://cdn.jsdelivr.net/gh/danielmenparan-lang/orvo@main/assets/orvo24/v8/";
const v=document.getElementById("v"),src=document.getElementById("src"),err=document.getElementById("err");
const fb=[CDN+"orvo24-v8-web.mp4","assets/orvo24/v8/orvo24-v8-web.mp4"];let i=0;
v.addEventListener("error",()=>{if(i>=fb.length){err.style.display="block";err.textContent="Could not load — try download.";return;}src.src=fb[i++];v.load();v.play().catch(()=>{});});
</script>
</body>
</html>
